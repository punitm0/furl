name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    # Smart Review's on-device model is only compiled with the macOS 26 SDK or later; Toolchain shows which Xcode ran.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build (release)
        run: swift build -c release --product Furl
      - name: Test
        run: swift test

  stats-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stats-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stats-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
